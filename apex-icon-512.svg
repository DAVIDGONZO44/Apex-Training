<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#070709"/>
  <rect width="512" height="512" fill="url(#grad)" opacity="0.4"/>
  <defs>
    <radialGradient id="grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#070709;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- APEX wordmark -->
  <text x="256" y="295" 
    font-family="Montserrat, Arial, sans-serif" 
    font-weight="800" 
    font-size="96" 
    fill="#c9a84c" 
    text-anchor="middle" 
    letter-spacing="16">APEX</text>
  <!-- Gold line underneath -->
  <rect x="176" y="316" width="160" height="1.5" fill="#c9a84c" opacity="0.6"/>
  <!-- Small tagline -->
  <text x="256" y="345" 
    font-family="Montserrat, Arial, sans-serif" 
    font-weight="400" 
    font-size="18" 
    fill="#737390" 
    text-anchor="middle" 
    letter-spacing="6">TRAINING</text>
</svg>